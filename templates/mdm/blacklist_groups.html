<!DOCTYPE html>
<html>
<head>
    <title>Apply Blacklist to Groups - MDM Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        .group-list { max-height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 15px; }
        .group-item { margin-bottom: 10px; padding: 10px; border: 1px solid #eee; border-radius: 4px; }
        .group-item:hover { background: #f8f9fa; }
        .btn { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-secondary { background: #6c757d; margin-left: 10px; }
        .select-all { margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Apply Blacklist to Groups</h1>
        
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="customer_id" value="{{ customer_id }}">
            
            <div class="select-all">
                <label>
                    <input type="checkbox" id="selectAll"> Select All Groups
                </label>
            </div>
            
            <h3>Select Groups:</h3>
            <div class="group-list">
                {% for group in groups %}
                <div class="group-item">
                    <label>
                        <input type="checkbox" name="group_ids" value="{{ group.id }}" class="group-checkbox">
                        <strong>{{ group.name }}</strong>
                        <br><small>{{ group.devices.count }} devices | Created: {{ group.created_at|date:"M d, Y" }}</small>
                    </label>
                </div>
                {% empty %}
                <p>No groups found for this customer.</p>
                {% endfor %}
            </div>
            
            <div style="margin-top: 20px;">
                <button type="submit" class="btn">Apply Blacklist</button>
                <a href="{% url 'mdm:app_policies' %}?customer_id={{ customer_id }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('selectAll').addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('.group-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.checked = this.checked;
            });
        });
    </script>
</body>
</html>
