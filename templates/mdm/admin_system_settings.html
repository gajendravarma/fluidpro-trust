{% extends 'base.html' %}

{% block title %}System Settings - MDM Admin{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="fas fa-cog me-2"></i>System Settings</h4>
                    <a href="{% url 'mdm:admin_dashboard' %}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Back to Admin
                    </a>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <h5>Global MDM Settings</h5>
                            <form class="mt-3">
                                <div class="mb-3">
                                    <label class="form-label">Default Enrollment Type</label>
                                    <select class="form-select">
                                        <option>Device Enrollment</option>
                                        <option>User Enrollment</option>
                                        <option>Automated Device Enrollment</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Session Timeout (minutes)</label>
                                    <input type="number" class="form-control" value="30">
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="require2fa">
                                    <label class="form-check-label" for="require2fa">Require Two-Factor Authentication</label>
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="autoCompliance">
                                    <label class="form-check-label" for="autoCompliance">Enable Automatic Compliance Checks</label>
                                </div>
                                <button type="submit" class="btn btn-primary">Save Settings</button>
                            </form>
                        </div>
                        <div class="col-md-6">
                            <h5>System Status</h5>
                            <div class="mt-3">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span>API Status</span>
                                    <span class="badge bg-success">Online</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span>Database</span>
                                    <span class="badge bg-success">Connected</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span>Last Sync</span>
                                    <span>{{ "now"|date:"H:i" }}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
