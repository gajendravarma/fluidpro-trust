<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Successful — FluidTrust Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .card-wrap {
      width: 100%; max-width: 420px;
      background: #fff; border-radius: 20px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.18);
      overflow: hidden; text-align: center;
      animation: slideUp .6s ease-out;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card-header-band {
      background: linear-gradient(135deg, #28a745, #1e7e34);
      padding: 2.5rem 2rem 2rem; color: #fff;
    }
    .icon-circle {
      width: 80px; height: 80px;
      background: rgba(255,255,255,.2);
      border: 3px solid rgba(255,255,255,.4);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.2rem;
    }
    .card-header-band h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: .4rem; }
    .card-header-band p  { opacity: .9; font-size: .9rem; }
    .card-body-area { padding: 2rem; }
    .card-body-area p { color: #555; font-size: .9rem; line-height: 1.6; margin-bottom: 1.75rem; }
    .btn-login {
      display: inline-block; width: 100%; padding: .85rem;
      background: linear-gradient(135deg, #4e73df, #224abe);
      border: none; border-radius: 10px; color: #fff;
      font-weight: 600; font-size: .95rem; text-decoration: none;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 14px rgba(78,115,223,.35);
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(78,115,223,.4); color: #fff; }
  </style>
</head>
<body>
  <div class="card-wrap">
    <div class="card-header-band">
      <div class="icon-circle">
        <i class="fas fa-check-circle fa-2x"></i>
      </div>
      <h2>Password Updated!</h2>
      <p>Your account is secured with your new password.</p>
    </div>
    <div class="card-body-area">
      <p>Your password has been reset successfully. You can now sign in to the FluidTrust Customer Portal using your new password.</p>
      <a href="{% url 'login' %}" class="btn-login">
        <i class="fas fa-sign-in-alt me-2"></i>Sign In Now
      </a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
