{% extends 'base.html' %}
{% block title %}Select Company{% endblock %}

{% block content %}
<div class="container-fluid px-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-0 fw-bold"><i class="fas fa-building text-primary me-2"></i>Company Dashboard</h1>
      <p class="text-muted mb-0 small">Select a company to view its dashboard</p>
    </div>
  </div>

  <div class="row g-3">
    {% for company in companies %}
    <div class="col-md-4 col-lg-3">
      <a href="{% url 'rbac:company_dashboard' %}?company={{ company.name|urlencode }}"
         class="text-decoration-none">
        <div class="card shadow-sm h-100 border-0 company-card" style="transition:transform .15s,box-shadow .15s;">
          <div class="card-body d-flex flex-column justify-content-center text-center py-4">
            <div class="mb-3">
              <span class="rounded-circle d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10"
                    style="width:56px;height:56px;">
                <i class="fas fa-building text-primary fa-lg"></i>
              </span>
            </div>
            <h6 class="fw-bold mb-1 text-dark">{{ company.name }}</h6>
            <small class="text-muted">{{ company.code }}</small>
          </div>
        </div>
      </a>
    </div>
    {% empty %}
    <div class="col-12">
      <div class="alert alert-info">No companies found.</div>
    </div>
    {% endfor %}
  </div>
</div>

<style>
.company-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.12) !important; }
</style>
{% endblock %}
