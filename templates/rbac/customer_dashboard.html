{% extends 'base.html' %}
{% load static %}

{% block title %}Customer Dashboard - {{ company.name }}{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-building" aria-hidden="true"></i> {{ company.name }} Dashboard
        </h1>
    </div>

    <!-- Reports Section -->
    <div class="row">
        <!-- ManageEngine Reports -->
        <div class="col-lg-12 mb-4">
            <div class="card shadow">
                <div class="card-header py-3">
                    <h2 class="h6 m-0 font-weight-bold text-primary">
                        <i class="fas fa-chart-bar" aria-hidden="true"></i> ManageEngine Ticket Reports
                    </h2>
                </div>
                <div class="card-body">
                    <iframe src="/tickets/reports/?company={{ company.code }}&embed=1" 
                            title="ManageEngine Reports Dashboard"
                            sandbox="allow-scripts allow-same-origin allow-forms"
                            style="width: 100%; height: 800px; border: none;">
                    </iframe>
                </div>
            </div>
        </div>

        <!-- Pulseway Device Reports -->
        <div class="col-lg-12 mb-4">
            <div class="card shadow">
                <div class="card-header py-3">
                    <h2 class="h6 m-0 font-weight-bold text-info">
                        <i class="fas fa-desktop" aria-hidden="true"></i> Pulseway Device Reports
                    </h2>
                </div>
                <div class="card-body">
                    <iframe src="/pulseway/company-dashboard/?company={{ company.name }}&embed=1" 
                            title="Pulseway Device Dashboard"
                            sandbox="allow-scripts allow-same-origin allow-forms"
                            style="width: 100%; height: 800px; border: none;">
                    </iframe>
                </div>
            </div>
        </div>

        <!-- Datto Backup Reports -->
        <div class="col-lg-12 mb-4">
            <div class="card shadow">
                <div class="card-header py-3">
                    <h2 class="h6 m-0 font-weight-bold text-success">
                        <i class="fas fa-hdd" aria-hidden="true"></i> Datto Backup & Recovery
                    </h2>
                </div>
                <div class="card-body">
                    <iframe src="/datto/dashboard/?company={{ company.code }}&embed=1" 
                            title="Datto Backup and Recovery Status"
                            sandbox="allow-scripts allow-same-origin allow-forms"
                            style="width: 100%; height: 600px; border: none;">
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
